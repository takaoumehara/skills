<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">takaoumehara/skills: one marketplace, six plugin repos</title>
  <desc id="desc">One marketplace catalog points to six plugin repositories on GitHub. Each plugin installs straight from its own repository.</desc>
  <style>
    .bg{fill:#f5f5f5}.surface{fill:#ffffff}
    .hair{stroke:#e5e5e5}.strong{stroke:#cfcfcf}
    .ink{fill:#0a0a0a}.ink2{fill:#3d3d3d}.muted{fill:#666666}.faint{fill:#999999}
    .line{stroke:#999999}
    .acc{fill:#0062cc}.acc-s{stroke:#0062cc}.acc-soft{fill:#e8f0fa}
    text{font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141414}.surface{fill:#111111}
      .hair{stroke:#262626}.strong{stroke:#3a3a3a}
      .ink{fill:#f2f2f2}.ink2{fill:#d4d4d4}.muted{fill:#a3a3a3}.faint{fill:#6b6b6b}
      .line{stroke:#6b6b6b}
      .acc{fill:#3b9cff}.acc-s{stroke:#3b9cff}.acc-soft{fill:#0f1f33}
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="420"/>

  <!-- Marketplace node -->
  <g transform="translate(110 150)">
    <rect class="acc-soft acc-s" x="0" y="0" width="320" height="120" rx="8" stroke-width="1.5"/>
    <text class="faint mono" x="24" y="34" font-size="10" letter-spacing="1.5">MARKETPLACE</text>
    <text class="ink" x="24" y="68" font-size="24" font-weight="500" letter-spacing="-0.5">takaoumehara/skills</text>
    <text class="muted mono" x="24" y="96" font-size="12">.claude-plugin/marketplace.json</text>
  </g>
  <circle class="acc" cx="430" cy="210" r="4"/>

  <text class="faint mono" x="600" y="30" font-size="10" letter-spacing="1.5" text-anchor="middle">SOURCE: GITHUB</text>

  <path class="line" d="M430 210 C 600 210, 610 60, 780 60" fill="none" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/>
  <path class="line" d="M430 210 C 600 210, 610 120, 780 120" fill="none" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/>
  <path class="line" d="M430 210 C 600 210, 610 180, 780 180" fill="none" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/>
  <path class="line" d="M430 210 C 600 210, 610 240, 780 240" fill="none" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/>
  <path class="line" d="M430 210 C 600 210, 610 300, 780 300" fill="none" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/>
  <path class="line" d="M430 210 C 600 210, 610 360, 780 360" fill="none" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/>
  <g transform="translate(780 38)">
    <rect class="surface strong" x="0" y="0" width="330" height="44" rx="6" stroke-width="1.25"/>
    <text class="faint mono" x="16" y="27" font-size="10">01</text>
    <text class="ink" x="44" y="27" font-size="15" font-weight="500">snap-pair</text>
    <text class="muted mono" x="314" y="27" font-size="10" text-anchor="end">1 skill</text>
  </g>
  <g transform="translate(780 98)">
    <rect class="surface strong" x="0" y="0" width="330" height="44" rx="6" stroke-width="1.25"/>
    <text class="faint mono" x="16" y="27" font-size="10">02</text>
    <text class="ink" x="44" y="27" font-size="15" font-weight="500">superforge-skills</text>
    <text class="muted mono" x="314" y="27" font-size="10" text-anchor="end">15 skills</text>
  </g>
  <g transform="translate(780 158)">
    <rect class="surface strong" x="0" y="0" width="330" height="44" rx="6" stroke-width="1.25"/>
    <text class="faint mono" x="16" y="27" font-size="10">03</text>
    <text class="ink" x="44" y="27" font-size="15" font-weight="500">interactive-experience-skills</text>
    <text class="muted mono" x="314" y="27" font-size="10" text-anchor="end">3 skills</text>
  </g>
  <g transform="translate(780 218)">
    <rect class="surface strong" x="0" y="0" width="330" height="44" rx="6" stroke-width="1.25"/>
    <text class="faint mono" x="16" y="27" font-size="10">04</text>
    <text class="ink" x="44" y="27" font-size="15" font-weight="500">intuitive-game-design</text>
    <text class="muted mono" x="314" y="27" font-size="10" text-anchor="end">1 skill</text>
  </g>
  <g transform="translate(780 278)">
    <rect class="surface strong" x="0" y="0" width="330" height="44" rx="6" stroke-width="1.25"/>
    <text class="faint mono" x="16" y="27" font-size="10">05</text>
    <text class="ink" x="44" y="27" font-size="15" font-weight="500">cross-model-handoff</text>
    <text class="muted mono" x="314" y="27" font-size="10" text-anchor="end">3 skills + 2 hooks</text>
  </g>
  <g transform="translate(780 338)">
    <rect class="surface strong" x="0" y="0" width="330" height="44" rx="6" stroke-width="1.25"/>
    <text class="faint mono" x="16" y="27" font-size="10">06</text>
    <text class="ink" x="44" y="27" font-size="15" font-weight="500">repo-cleanup</text>
    <text class="muted mono" x="314" y="27" font-size="10" text-anchor="end">1 skill</text>
  </g>
</svg>
